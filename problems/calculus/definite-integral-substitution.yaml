id: calculus-definite-substitution-001
title: 换元法求定积分
difficulty: 3
tags: [calculus, integral, substitution, definite]
source: original
statement: |
  求定积分 $\displaystyle\int_0^1 2x e^{x^2} \, dx$。
hints:
  - 注意到 $(x^2)' = 2x$，可令 $u = x^2$
  - 定积分换元要换上下限
solution:
  approach: u-substitution
  steps:
    - '令 $u = x^2$，$du = 2x\,dx$'
    - '$x=0 \Rightarrow u=0$；$x=1 \Rightarrow u=1$'
    - '$\int_0^1 2x e^{x^2} dx = \int_0^1 e^u du = e^u \big|_0^1 = e - 1$'
  answer: '$e - 1$'
verification:
  type: symbolic
  expression: "sp.integrate(2*x*sp.exp(x**2), (x, 0, 1))"
  expected: "E - 1"
metadata:
  created: 2025-06-27
  author: MathAI
