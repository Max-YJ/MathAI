id: calculus-limit-lhopital-001
title: 洛必达法则求极限
difficulty: 3
tags: [calculus, limit, lhopital]
source: original
statement: |
  求极限 $\displaystyle\lim_{x \to 0} \frac{e^x - 1 - x}{x^2}$。
hints:
  - 代入 $x=0$ 得 $\frac{0}{0}$，考虑洛必达
  - 可能需要连续使用两次洛必达
solution:
  approach: L'Hôpital's rule (twice)
  steps:
    - '$x\to 0$ 时分子分母均 $\to 0$，为 $\frac{0}{0}$ 型'
    - '第一次洛必达：$\lim \frac{e^x-1}{2x}$，仍为 $\frac{0}{0}$'
    - '第二次洛必达：$\lim \frac{e^x}{2} = \frac{1}{2}$'
  answer: '$\frac{1}{2}$'
verification:
  type: symbolic
  expression: "sp.limit((sp.exp(x)-1-x)/x**2, x, 0)"
  expected: "1/2"
metadata:
  created: 2025-06-27
  author: MathAI
